<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniTikTok - Reklamsız</title>
    <!-- Google Fonts - Xüsusi şriftlər üçün -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Əsas Video Lent (Feed) -->
    <div class="video-container">
        
        <!-- Video Kartı 1 -->
        <div class="video-card">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop playsinline></video>
            <div class="overlay">
                <!-- Rəngli Loqo və ya Profil -->
                <div class="logo-badge" style="background: linear-gradient(45deg, #ff0050, #00f2fe);">TikTok+</div>
                <h3 class="username">@istifadeci_1</h3>
                <p class="description">Bu reklamsız və şriftli video tətbiqidir! 🚀</p>
            </div>
        </div>

        <!-- Video Kartı 2 -->
        <div class="video-card">
            <video src="https://www.w3schools.com/html/movie.mp4" loop playsinline></video>
            <div class="overlay">
                <div class="logo-badge" style="background: linear-gradient(45deg, #7928ca, #ff0080);">Pro</div>
                <h3 class="username">@test_user</h3>
                <p class="description">İkinci video sınağı ✨</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
