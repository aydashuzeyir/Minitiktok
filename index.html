<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniTikTok - Reklamsız</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="video-container">
        <!-- Video Karti 1 -->
        <div class="video-card">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop playsinline></video>
            <div class="overlay">
                <div class="logo-badge" style="background: linear-gradient(45deg, #00c6ff, #0072ff);">@istifadeci_1</div>
                <h3 class="username">@istifadeci_1</h3>
                <p class="description">Bu reklamsız və şriftli video tətbiqidir! 🚀</p>
            </div>
        </div>

        <!-- Video Karti 2 -->
        <div class="video-card">
            <video src="https://www.w3schools.com/html/movie.mp4" loop playsinline></video>
            <div class="overlay">
                <div class="logo-badge" style="background: linear-gradient(45deg, #f7ff00, #db36a4);">@test_user</div>
                <h3 class="username">@test_user</h3>
                <p class="description">İkinci video sınağı ✨</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
