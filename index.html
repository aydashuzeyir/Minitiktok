<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniTikTok - Reklamsız</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="video-container">
        <!-- Video Karti 1: Sadə rəngli qradiyent fon -->
        <div class="video-card">
            <video src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-numbers-31912-large.mp4" loop playsinline muted></video>
            <div class="overlay">
                <div class="logo-badge" style="background: linear-gradient(45deg, #4facfe, #00f2fe);">@minitiktok</div>
                <h3 class="username">@test_istifadeci</h3>
                <p class="description">Rəqəmsal animasiya testi 🎬</p>
            </div>
        </div>

        <!-- Video Karti 2: Abstrakt işıq effekti -->
        <div class="video-card">
            <video src="https://assets.mixkit.co/videos/preview/mixkit-lines-in-the-background-of-a-screen-31122-large.mp4" loop playsinline muted></video>
            <div class="overlay">
                <div class="logo-badge" style="background: linear-gradient(45deg, #fa709a, #fee140);">@dizayn</div>
                <h3 class="username">@abstrakt_fon</h3>
                <p class="description">Səliqəli fon çizgileri ✨</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
